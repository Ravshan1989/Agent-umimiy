[project]
name = "rms-ai"
version = "0.7.2"
description = "Barcha AI agentlarni birlashtiruvchi desktop ilova"
requires-python = ">=3.11"
license = {text = "MIT"}
readme = "README.md"
dependencies = ["pypdf", "qrcode", "pillow", "python-docx", "openpyxl", "python-pptx", "pywebview; sys_platform == 'win32'"]

[project.scripts]
rms-ai = "rms_ai.__main__:main"

[tool.setuptools]
packages = ["rms_ai"]

[tool.setuptools.package-data]
rms_ai = ["static/*.png", "static/web/index.html", "static/web/assets/*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# Mantiqiy xatolarga e'tibor; uslubiy (keng try/except kabi, ataylab) qoidalar o'chirilgan.
select = ["F", "I", "UP", "B", "FURB", "PERF", "C4", "ISC"]
ignore = [
    "B008",    # argument standartida funksiya chaqiruvi (Tkinter uslubi)
    "B904",    # except ichida `raise ... from` talab qilinmaydi
    "UP031",   # printf-uslubdagi formatlashga ruxsat
    "PERF203", # try/except ichidagi sikl
    "PERF401", # qo'lda list tuzish (o'qilishi uchun qoldirildi)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "F841"]
