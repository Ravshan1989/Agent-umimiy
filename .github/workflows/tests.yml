name: Testlar / Tests

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Ixtiyoriy kutubxonalar
        run: python -m pip install --upgrade pip && pip install pypdf qrcode

      - name: Testlar
        run: python -m unittest discover -s tests -t . -v
