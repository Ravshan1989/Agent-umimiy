name: Dastur yig'ish / Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Mavjud nashr tegi (masalan v0.2.0): fayllar shu nashrga biriktiriladi. Bo'sh qolsa faqat yig'iladi."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write  # fayllarni nashrga (Releases) biriktirish uchun

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: dist/AgentUmimiy-Setup.exe
          - os: ubuntu-22.04  # eskiroq glibc: yangi va eski Linux'larda ishlaydi
            asset: dist/AgentUmimiy-Linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pypdf qrcode pillow
      - run: python -m unittest discover -s tests -t .
      - run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --hidden-import pypdf --hidden-import qrcode --hidden-import PIL.ImageGrab
          --add-data agent_umimiy/static:agent_umimiy/static
          --name AgentUmimiy app.py
      - name: Yig'ilgan dasturni sinash (veb-server rejimi)
        run: |
          dist/AgentUmimiy/AgentUmimiy --serve --host 127.0.0.1 --port 8123 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8123/icon-192.png -o /dev/null && exit 0
            sleep 1
          done
          exit 1
      - if: runner.os == 'Windows'
        name: O'rnatuvchi (Inno Setup)
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          iscc packaging\installer.iss
      - if: runner.os == 'Linux'
        name: Arxiv (tar.gz)
        run: tar -czf dist/AgentUmimiy-Linux-x86_64.tar.gz -C dist AgentUmimiy
      - uses: actions/upload-artifact@v4
        with:
          name: AgentUmimiy-${{ runner.os }}
          path: ${{ matrix.asset }}
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ matrix.asset }}
