name: Dastur yig'ish / Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Mavjud nashr tegi (masalan v0.2.0): fayllar shu nashrga biriktiriladi. Bo'sh qolsa faqat yig'iladi."
        required: false
        default: ""
  push:
    branches: ["main", "design/maket-dashboard", "feature/ultra-modern-full-integration"]
    tags: ["v*"]

permissions:
  contents: write  # fayllarni nashrga (Releases) biriktirish uchun

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: dist/AgentUmimiy-Setup.exe
          - os: ubuntu-22.04  # eskiroq glibc: yangi va eski Linux'larda ishlaydi
            asset: dist/AgentUmimiy-Linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Ultra zamonaviy web interfeysni yig'ish
        working-directory: frontend
        run: npm install && npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pypdf qrcode pillow python-docx openpyxl python-pptx pywebview
      - name: Testlar (Linux'da oyna sinovlari uchun virtual ekran bilan)
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} python -m unittest discover -s tests -t .
      - name: Dasturni yig'ish (packaging/build_windows.bat bilan bir xil parametrlar)
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --hidden-import pypdf --hidden-import qrcode --hidden-import PIL.ImageGrab --hidden-import webview
          ${{ runner.os == 'Windows' && '--hidden-import tkinter --hidden-import _tkinter --runtime-hook packaging/rthook_tkinter.py' || '' }}
          --add-data "agent_umimiy/static${{ runner.os == 'Windows' && ';' || ':' }}agent_umimiy/static"
          --add-data "packaging/AgentUmimiy.ico${{ runner.os == 'Windows' && ';' || ':' }}."
          ${{ runner.os == 'Windows' && '--icon packaging/AgentUmimiy.ico' || '' }}
          --name AgentUmimiy app.py
      - if: runner.os == 'Windows'  # klassik Tk oyna faqat Windows to'plamida tarqatiladi
        name: Yig'ilgan to'plam tekshiruvi (klassik oyna ishlashi uchun kerak bo'lgan fayllar)
        run: |
          cd dist/AgentUmimiy
          test -d _internal/_tcl_data || test -d _tcl_data
          test -d _internal/_tk_data || test -d _tk_data
          test -f _internal/AgentUmimiy.ico || test -f AgentUmimiy.ico
          # Quvur ishlatilmaydi: mos kelmagan shablon bilan `ls` 2 qaytaradi va `pipefail` uni qadam xatosiga aylantiradi.
          test -n "$(ls _internal/_tkinter* _tkinter* 2>/dev/null)"
      - name: Yig'ilgan dasturni sinash (veb-server rejimi)
        run: |
          dist/AgentUmimiy/AgentUmimiy --serve --host 127.0.0.1 --port 8123 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8123/ -o /tmp/agent-umimiy-index.html; then break; fi
            sleep 1
          done
          test -s /tmp/agent-umimiy-index.html
          grep -q '/assets/' /tmp/agent-umimiy-index.html
          asset=$(grep -oE 'src="/assets/[^" ]+\.js"' /tmp/agent-umimiy-index.html | head -1 | cut -d '"' -f2)
          test -n "$asset"
          curl -sf "http://127.0.0.1:8123$asset" -o /dev/null
          curl -sf http://127.0.0.1:8123/manifest.webmanifest -o /dev/null
          curl -sf http://127.0.0.1:8123/icon-192.png -o /dev/null
      - if: runner.os == 'Windows'
        name: O'rnatuvchi (Inno Setup)
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          iscc packaging\installer.iss
      - if: runner.os == 'Linux'
        name: Arxiv (tar.gz)
        run: tar -czf dist/AgentUmimiy-Linux-x86_64.tar.gz -C dist AgentUmimiy
      - uses: actions/upload-artifact@v7
        with:
          name: AgentUmimiy-${{ runner.os }}
          path: ${{ matrix.asset }}
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ matrix.asset }}
