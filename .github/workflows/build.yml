name: Dastur yig'ish / Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Mavjud nashr tegi (masalan v0.2.0): fayllar shu nashrga biriktiriladi. Bo'sh qolsa faqat yig'iladi."
        required: false
        default: ""
  push:
    branches: ["main", "design/maket-dashboard", "feature/ultra-modern-full-integration", "audit/**"]
    tags: ["v*"]

permissions:
  contents: write  # fayllarni nashrga (Releases) biriktirish uchun

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: |
              dist/RMSAI-Setup.exe
              dist/RMSAIClient-Setup.exe
          - os: ubuntu-22.04  # eskiroq glibc: yangi va eski Linux'larda ishlaydi
            asset: dist/RMSAI-Linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Ultra zamonaviy web interfeysni yig'ish
        working-directory: frontend
        run: npm ci && npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pypdf qrcode pillow python-docx openpyxl python-pptx pywebview
      - name: Testlar (Linux'da oyna sinovlari uchun virtual ekran bilan)
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} python -m unittest discover -s tests -t .
      - name: Dasturni yig'ish (packaging/build_windows.bat bilan bir xil parametrlar)
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --hidden-import pypdf --hidden-import qrcode --hidden-import PIL.ImageGrab --hidden-import webview
          ${{ runner.os == 'Windows' && '--hidden-import tkinter --hidden-import _tkinter --runtime-hook packaging/rthook_tkinter.py' || '' }}
          --add-data "rms_ai/static${{ runner.os == 'Windows' && ';' || ':' }}rms_ai/static"
          --add-data "packaging/RMSAI.ico${{ runner.os == 'Windows' && ';' || ':' }}."
          ${{ runner.os == 'Windows' && '--icon packaging/RMSAI.ico' || '' }}
          --name RMSAI app.py
      - if: runner.os == 'Windows'
        name: Mijoz dasturini yig'ish (RMSAIClient)
        run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --hidden-import webview --icon packaging/RMSAI.ico
          --name RMSAIClient client_app.py
      - if: runner.os == 'Windows'  # klassik Tk oyna faqat Windows to'plamida tarqatiladi
        name: Yig'ilgan to'plam tekshiruvi (klassik oyna ishlashi uchun kerak bo'lgan fayllar)
        run: |
          cd dist/RMSAI
          test -d _internal/_tcl_data || test -d _tcl_data
          test -d _internal/_tk_data || test -d _tk_data
          test -f _internal/RMSAI.ico || test -f RMSAI.ico
          # Quvur ishlatilmaydi: mos kelmagan shablon bilan `ls` 2 qaytaradi va `pipefail` uni qadam xatosiga aylantiradi.
          test -n "$(ls _internal/_tkinter* _tkinter* 2>/dev/null)"
      - name: Yig'ilgan dasturni sinash (veb-server rejimi)
        run: |
          dist/RMSAI/RMSAI --serve --host 127.0.0.1 --port 8123 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8123/ -o /tmp/rms-ai-index.html; then break; fi
            sleep 1
          done
          test -s /tmp/rms-ai-index.html
          grep -q '/assets/' /tmp/rms-ai-index.html
          asset=$(grep -oE 'src="/assets/[^" ]+\.js"' /tmp/rms-ai-index.html | head -1 | cut -d '"' -f2)
          test -n "$asset"
          curl -sf "http://127.0.0.1:8123$asset" -o /dev/null
          curl -sf http://127.0.0.1:8123/manifest.webmanifest -o /dev/null
          curl -sf http://127.0.0.1:8123/icon-192.png -o /dev/null
      - if: runner.os == 'Windows'
        name: O'rnatuvchi (Inno Setup)
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          iscc packaging\installer.iss
          iscc packaging\client_installer.iss
      - if: runner.os == 'Windows'
        name: O'rnatilgan server va mijoz paketlarini tekshirish
        shell: pwsh
        run: |
          $serverDir = Join-Path $env:RUNNER_TEMP 'RMSAI-Install'
          & '.\dist\RMSAI-Setup.exe' /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$serverDir"
          if ($LASTEXITCODE -ne 0) { throw "RMS AI o'rnatuvchisi xato qaytardi: $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $serverDir 'RMSAI.exe'))) { throw 'RMSAI.exe o''rnatilmadi.' }
          $server = Start-Process -FilePath (Join-Path $serverDir 'RMSAI.exe') -ArgumentList @('--serve', '--host', '127.0.0.1', '--port', '18123') -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              if ($server.HasExited) { throw "O'rnatilgan RMS AI serveri muddatidan oldin yopildi: $($server.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:18123/' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { }
              Start-Sleep -Seconds 1
            }
            if (-not $ready) { throw 'O''rnatilgan RMS AI serveri HTTP javob bermadi.' }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
          & (Join-Path $serverDir 'unins000.exe') /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "RMS AI server uninstall xato qaytardi: $LASTEXITCODE" }
          $clientDir = Join-Path $env:RUNNER_TEMP 'RMSAIClient-Install'
          & '.\dist\RMSAIClient-Setup.exe' /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$clientDir"
          if ($LASTEXITCODE -ne 0) { throw "RMS AI Client o'rnatuvchisi xato qaytardi: $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $clientDir 'RMSAIClient.exe'))) { throw 'RMSAIClient.exe o''rnatilmadi.' }
          & (Join-Path $clientDir 'unins000.exe') /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) { throw "RMS AI Client uninstall xato qaytardi: $LASTEXITCODE" }
      - if: runner.os == 'Linux'
        name: Arxiv (tar.gz)
        run: tar -czf dist/RMSAI-Linux-x86_64.tar.gz -C dist RMSAI
      - uses: actions/upload-artifact@v7
        with:
          name: RMSAI-${{ runner.os }}
          path: ${{ matrix.asset }}
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ matrix.asset }}
