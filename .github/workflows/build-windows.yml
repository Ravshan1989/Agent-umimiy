name: Windows .exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pypdf
      - run: python -m unittest discover -s tests -t .
      - run: python -m PyInstaller --noconfirm --clean --windowed --hidden-import pypdf --name AgentUmimiy app.py
      - run: choco install innosetup -y --no-progress
      - run: iscc packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: AgentUmimiy-Windows
          path: |
            dist/AgentUmimiy-Setup.exe
            dist/AgentUmimiy/
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AgentUmimiy-Setup.exe
