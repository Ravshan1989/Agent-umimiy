name: Windows .exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Mavjud nashr tegi (masalan v0.2.0): o'rnatuvchi shu nashrga biriktiriladi. Bo'sh qolsa faqat yig'iladi."
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write  # o'rnatuvchini nashrga (Releases) biriktirish uchun

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller pypdf qrcode pillow
      - run: python -m unittest discover -s tests -t .
      - run: python -m PyInstaller --noconfirm --clean --windowed --hidden-import pypdf --hidden-import qrcode --hidden-import PIL.ImageGrab --name AgentUmimiy app.py
      - run: choco install innosetup -y --no-progress
      - run: iscc packaging\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: AgentUmimiy-Windows
          path: |
            dist/AgentUmimiy-Setup.exe
            dist/AgentUmimiy/
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/AgentUmimiy-Setup.exe
